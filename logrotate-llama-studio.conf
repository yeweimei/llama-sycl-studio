# llama-studio 实例日志轮转
# - size 50M 触发：防止单个实例日志无限累积（后台模型每请求写 print_timing）
# - copytruncate：不打断正在写入的 llama-server（不切换 inode，避免 fd 丢失）
# - rotate 5 + compress：保留 5 份压缩历史，总量可控
# - missingok/notifempty：无日志或空文件不报错
/root/.llama-studio/instances/*.log {
    size 50M
    rotate 5
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nomail
    create 644 root root
}