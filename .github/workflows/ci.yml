name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps (incl. dev/test)
        run: pip install --quiet -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Syntax check
        run: |
          python -m py_compile backend/main.py backend/run.py
          find backend/app backend/tests -name '*.py' -exec python -m py_compile {} +
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
